<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda Corte</title>
    <style>
      footer {
    background-color: #333; /* Fundo escuro */
    color: #fff; /* Letra branca */
    text-align: center;
    padding: 30px 20px; /* Espaçamento interno */
    font-family: Arial, sans-serif;
}

.redes-sociais {
    margin-bottom: 15px; 
}

.redes-sociais a {
    color: #fff;
    text-decoration: none;
    margin: 0 15px; 
    font-weight: bold;
    transition: color 0.3s ease; 
}

.redes-sociais a:hover {
    color: #4CAF50;
}

footer p {
    margin: 0;
    font-size: 14px;
    color: #ccc; 
}

@media (max-width: 600px) {
    footer {
        padding: 20px 10px; 
    }

    .redes-sociais {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px; 
    }

    .redes-sociais a {
        margin: 0; 
        padding: 10px;
        font-size: 16px;
        width: 100%;
        text-emphasis: center;
    }
}
    </style>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda Corte</title>
    <style>
      *{
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      
  /* CONFIGURAÇÃO GERAL */
  * {
    box-sizing: border-box; /* Garante que o padding não aumente o tamanho dos campos */
  }

  body {
    margin: 0;
    padding: 0;
    overflow-x: hidden; /* Proíbe o site de "dançar" para os lados no celular */
    background-color: #16171d; 
  }

  /* AJUSTE DO RODAPÉ (FOOTER) */
  footer {
    background-color: #16171d;
    color: #fff;
    text-align: center;
    padding: 40px 20px;
    font-family: system-ui, sans-serif;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
  }

  .redes-sociais {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 20px;
  }

  .redes-sociais a {
    color: #a78bfa;
    text-decoration: none;
    font-weight: bold;
  }

  /* 📱 O PULO DO GATO: RESPONSIVIDADE FORÇADA */
  @media (max-width: 600px) {
    /* 1. Ajusta o container principal que o React cria */
    #root > div {
      padding: 15px !important;
      width: 100% !important;
    }

    /* 2. Ajusta o Card Branco (Agende seu horário) */
    #root div[style*="background-color: rgb(255, 255, 255)"],
    #root div[style*="background-color: #fff"] {
      padding: 20px 15px !important;
      width: 100% !important;
      max-width: 100% !important;
    }

    /* 3. Empilha Nome e WhatsApp (O que estava torto na foto) */
    div[style*="display: flex"] {
      flex-direction: column !important;
      gap: 10px !important;
    }

    input, select, button {
      width: 100% !important; /* Garante que nada saia da tela */
      font-size: 16px !important; /* Evita o zoom automático do iPhone */
    }

    /* 4. Ajusta o Rodapé no celular */
    .redes-sociais {
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    
    footer {
      border-radius: 0 !important;
      padding: 30px 10px;
    }
  }
</style>
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    
  </body>
  <footer>
    <div class="redes-sociais">
        <a href="https://www.instagram.com/ickisz/" target="_blank">Instagram</a>
        <a href="https://www.linkedin.com/in/guilherme-vasconcelos-dev/">LinkedIn</a>
        <a href="https://github.com/GuiVasconcelosDev" target="_blank">GitHub</a>
    </div>
    <p>&copy; 2026 Guilherme Vasconcelos. Todos os direitos reservados.</p>
</footer>
</html>
